<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fragment+Mono&family=Schibsted+Grotesk:wght@400;500&family=Young+Serif&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #f4efe6; color: #16202e;
    font-family: "Schibsted Grotesk", sans-serif;
    box-sizing: border-box; padding: 72px 80px;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .top { display: flex; justify-content: space-between; align-items: center;
    font-family: "Fragment Mono", monospace; font-size: 20px; letter-spacing: .06em;
    text-transform: uppercase; color: #5b616a; border-top: 1px solid #d9d3c5; padding-top: 18px; }
  .top b { color: #1b5e9b; font-weight: 400; }
  h1 { font-family: "Young Serif", serif; font-weight: 400; font-size: 150px; line-height: .95;
    letter-spacing: -0.025em; margin: 0; }
  h1 span { color: #1b5e9b; }
  p { font-size: 34px; line-height: 1.35; margin: 28px 0 0; max-width: 900px; }
  .rule { width: 96px; height: 6px; background: #1b5e9b; }
</style>
</head>
<body>
  <div class="top"><span><b>TD</b> / Portfolio</span><span>Charlotte, NC</span></div>
  <div>
    <h1>Taran Duba<span>.</span></h1>
    <p>Founder of Byte-Sized Python. Programming lead for FRC Team 3506.</p>
  </div>
  <div class="rule"></div>
</body>
</html>
